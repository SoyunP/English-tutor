<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Lab — Preview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1f2a24;
      --card: #fff;
      --muted: #5c6b63;
      --primary: #3d7a5f;
      --accent: #d8ebe0;
      --border: #d5ddd7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Pretendard, "Noto Sans KR", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at top left, rgba(61,122,95,.08), transparent 40%),
        radial-gradient(circle at top right, rgba(184,140,72,.06), transparent 35%),
        var(--bg);
      min-height: 100vh;
    }
    h1, h2, .brand { font-family: Fraunces, Georgia, serif; }
    .topbar {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    header {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { font-size: 28px; color: var(--primary); margin: 0; }
    .tagline { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .tabs {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 1px solid #e5e7eb;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      border-radius: 0;
      padding: 12px 14px 11px;
      margin-bottom: -1px;
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .tab svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .tab:hover { color: #374151; }
    .tab.active {
      color: #111827;
      border-bottom-color: #111827;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }
    .hero h1 { font-size: 36px; margin: 4px 0 8px; }
    .hero p { color: var(--muted); margin: 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 28px 0;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(213,221,215,.8);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(31,42,36,.04);
    }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
    .card h2 { font-size: 18px; margin: 0 0 8px; color: var(--primary); }
    .card .desc { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--border);
      background: #eef2ee;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--fg);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 44px;
      padding: 0 20px;
      border-radius: 12px;
      background: var(--primary);
      color: #f7fff9;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .btn.outline {
      background: #fff;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .day {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background: #e8f5ee;
      color: #067647;
    }
    .badge.upcoming { background: #eef2ee; color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
    .section-title { font-size: 24px; margin: 0 0 16px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .passage {
      background: #fbfaf7;
      border-left: 3px solid var(--primary);
      padding: 14px 16px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      margin: 12px 0;
    }
    .option {
      display: flex;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .option:hover, .option.selected { border-color: var(--primary); background: rgba(216,235,224,.5); }
    textarea {
      width: 100%;
      min-height: 90px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      resize: vertical;
    }
    label { font-size: 14px; font-weight: 600; display: block; margin: 14px 0 6px; }
    .help { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Words: mode toggle */
    .mode-toggle {
      display: inline-flex;
      background: #eef2ee;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin: 12px 0 20px;
    }
    .mode-toggle button {
      border: none;
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-toggle button.active {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }

    /* Flashcards */
    .flash-wrap { max-width: 480px; margin: 0 auto; }
    .flash-progress {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .flash-card {
      perspective: 1000px;
      height: 260px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .flash-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .45s;
      transform-style: preserve-3d;
    }
    .flash-card.flipped .flash-inner { transform: rotateY(180deg); }
    .flash-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(31,42,36,.06);
    }
    .flash-face.back {
      transform: rotateY(180deg);
      background: #f3faf6;
    }
    .flash-word { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
    .flash-pos { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .flash-meaning { font-size: 28px; font-weight: 600; color: var(--primary); }
    .flash-example { font-size: 14px; color: var(--muted); margin-top: 14px; line-height: 1.5; max-width: 360px; }
    .flash-hint { font-size: 12px; color: var(--muted); margin-top: 16px; }
    .flash-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Word list */
    .word-list { display: none; }
    .word-list.active { display: block; }
    .flash-wrap.hidden { display: none; }
    .word-row {
      display: grid;
      grid-template-columns: 140px 70px 1fr;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e8ece9;
      font-size: 14px;
      align-items: start;
    }
    .word-row:last-child { border-bottom: none; }
    .word-en { font-weight: 600; font-size: 16px; }
    .word-pos { color: var(--muted); font-size: 12px; padding-top: 4px; }
    .word-ko { color: var(--fg); }
    .word-ex { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.45; }

    /* Dashboard */
    .dash-top { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin: 24px 0 12px; }
    .dday-card { background: #3d7a5f; color: #fff; border-color: #3d7a5f; }
    .dday-card .stat-label, .dday-card .muted { color: #d8ebe0; }
    .dday-value { font-family: Fraunces, Georgia, serif; font-size: 44px; font-weight: 700; line-height: 1.1; margin: 4px 0; }
    .exam-edit { margin-top: 10px; font-size: 12px; }
    .exam-edit summary { cursor: pointer; color: #d8ebe0; }
    .exam-edit input { margin-top: 6px; border-radius: 8px; border: none; padding: 6px 8px; font: inherit; }
    .progress-value { font-size: 32px; font-weight: 700; margin: 6px 0 10px; }
    .progress-value span { font-size: 18px; color: var(--muted); font-weight: 500; }
    .pbar { height: 12px; background: #e6ece8; border-radius: 999px; overflow: hidden; }
    .pbar > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .4s; }
    .pbar.thin { height: 6px; margin-top: 6px; }
    .pbar.thin > div { background: #9cc5b0; }
    .today-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; border-color: #b9d8c6; background: #f3faf6; }
    .today-title { font-size: 18px; font-weight: 700; margin: 4px 0; }
    .hw-badge { display: inline-flex; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
    .hw-badge.upcoming { background: #eef2ee; color: var(--muted); }
    .hw-badge.today { background: #e8f5ee; color: #067647; }
    .hw-badge.progress { background: #fff4e5; color: #b54708; }
    .hw-badge.done { background: #e8eefb; color: #175cd3; }
    .hw-badge.late { background: #fef3f2; color: #b42318; }
    .card.day.is-today { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
    .week { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; }
    .week summary { cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 4px 0; }
    .week[open] summary { margin-bottom: 10px; }
    .week-count { margin-left: auto; font-size: 13px; color: var(--muted); }
    .week .card.day { box-shadow: none; }
    .tag-kind { background: #e8eefb; color: #175cd3; }
    @media (max-width: 720px) { .dash-top { grid-template-columns: 1fr; } }

    /* Words filters */
    .word-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
    .word-filter {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      color: var(--fg);
    }
    .word-filter span { color: var(--muted); font-size: 12px; margin-left: 2px; }
    .word-filter.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .word-filter.active span { color: #d8ebe0; }
    .word-tag {
      display: inline-block;
      background: #fbe7d9;
      color: #8a3a20;
      border-radius: 6px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .word-tag:empty { display: none; }

    /* Lessons */
    .lesson-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .lesson-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      text-align: left;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      font: inherit;
      color: var(--fg);
      transition: border-color .15s, background .15s;
    }
    .lesson-pill:hover { border-color: var(--primary); }
    .lesson-pill.active { border-color: var(--primary); background: #eef7f1; box-shadow: inset 0 0 0 1px var(--primary); }
    .pill-no { font-size: 12px; font-weight: 600; color: var(--primary); }
    .pill-title { font-size: 13px; line-height: 1.35; }
    @media (max-width: 720px) { .lesson-picker { grid-template-columns: 1fr 1fr; } }
    .sub-tabs { flex-wrap: wrap; }
    .l5-sub { display: none; }
    .l5-sub.active { display: block; }
    .summary-ko {
      background: #f3faf6;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.6;
      margin: 4px 0 12px;
    }
    .summary-ko strong { color: var(--primary); margin-right: 6px; }
    .page-img {
      display: block;
      width: 100%;
      max-width: 640px;
      margin: 0 auto 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .passage-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .book-page {
      background: #fffdf8;
      border: 1px solid #eadfcd;
      border-radius: 18px;
      padding: 36px 44px 44px;
      box-shadow: 0 1px 2px rgba(31, 42, 36, .04), 0 12px 32px rgba(120, 90, 50, .06);
    }
    .book-tag {
      display: inline-block;
      background: #e8603c;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 10px;
      letter-spacing: .02em;
    }
    .book-title {
      font-family: Fraunces, Georgia, serif;
      font-size: 30px;
      color: #c2492b;
      margin: 10px 0 24px;
      line-height: 1.25;
    }
    .book-para {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 2.05;
      color: #2b2a26;
      margin: 0 0 18px;
    }
    .book-empty { color: var(--muted); font-size: 15px; }
    .ko-note {
      background: #f3faf6;
      border-left: 3px solid var(--primary);
      border-radius: 0 12px 12px 0;
      padding: 12px 16px;
      margin: -4px 0 24px;
      font-size: 15px;
      line-height: 1.8;
      color: #2c3e35;
    }
    .ko-note-tag {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      padding: 2px 8px;
      margin-right: 8px;
    }
    .book-para.dialog { display: flex; gap: 10px; }
    .speaker {
      flex-shrink: 0;
      min-width: 86px;
      font-family: Pretendard, sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #c2492b;
      padding-top: 3px;
    }
    .book-cast {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 4px 0 24px;
    }
    .book-cast span {
      background: #fbe7d9;
      color: #8a3a20;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .book-check {
      border-top: 1px dashed #e2d3bb;
      margin-top: 28px;
      padding-top: 18px;
    }
    .check-q { margin: 0 0 8px; font-size: 15px; color: #3d5a8a; font-weight: 600; }
    .big-q {
      margin-top: 14px;
      background: #eef4fb;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #1f3d6b;
    }
    .big-q-tag {
      background: #e8603c;
      color: #fff;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      margin-right: 6px;
    }
    .big-q details { margin-top: 8px; font-weight: 400; color: var(--fg); }
    .big-q summary { cursor: pointer; font-size: 13px; color: var(--primary); }
    @media (max-width: 720px) {
      .book-para.dialog { flex-direction: column; gap: 0; }
    }
    .sent { cursor: pointer; border-radius: 4px; transition: background .15s; }
    .sent:hover { background: #f6efe1; }
    .sent.selected { background: #fbe7d9; }
    .sent:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .sent mark.vocab { cursor: pointer; }
    .sent mark.vocab:hover { background: #c9e8d5; }
    .sn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #e8603c;
      color: #fff;
      font-family: Pretendard, sans-serif;
      font-size: 10px;
      font-weight: 700;
      margin-right: 3px;
      vertical-align: super;
      line-height: 1;
    }
    @media (max-width: 720px) {
      .book-page { padding: 24px 20px 28px; }
      .book-para { font-size: 17px; }
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(31, 42, 36, .18);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 40;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(440px, 100%);
      background: #fff;
      border-left: 1px solid var(--border);
      box-shadow: -12px 0 32px rgba(31, 42, 36, .08);
      transform: translateX(100%);
      transition: transform .25s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-close {
      align-self: flex-end;
      margin: 12px 12px 0;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #f1f3f1;
      cursor: pointer;
      font-size: 16px;
    }
    .drawer-body { overflow-y: auto; padding: 4px 22px 32px; }
    .drawer-sentence { font-size: 18px; line-height: 1.6; margin: 4px 0 8px; }
    .drawer-word { font-size: 30px; font-weight: 700; margin: 0; }
    .drawer-meaning { font-size: 18px; font-weight: 600; color: var(--primary); margin: 0 0 12px; }
    .drawer-h { font-size: 15px; margin: 20px 0 8px; }
    .drawer-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .drawer-block summary { cursor: pointer; font-weight: 600; font-size: 14px; }
    .chip-btn { cursor: pointer; font: inherit; font-size: 13px; }
    .chip-btn:hover { border-color: var(--primary); }
    .drawer-sent-link {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfa;
      padding: 10px 12px;
      margin-bottom: 8px;
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
      cursor: pointer;
    }
    .drawer-sent-link:hover { border-color: var(--primary); }
    .summary-toggle summary { cursor: pointer; font-size: 13px; color: var(--primary); font-weight: 600; }
    .summary-toggle .summary-ko { margin-top: 8px; }
    .sent-list { list-style: none; margin: 0; padding: 0; }
    .sent-row {
      display: flex;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
    }
    .sent-row:hover { background: #f6f8f6; }
    .sent-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #f3e3dc;
      color: #b4532a;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .sent-en { font-size: 16px; line-height: 1.65; }
    .sent-ko { display: none; font-size: 13px; color: var(--muted); margin-top: 4px; }
    .sent-row.open .sent-ko { display: block; }
    mark.vocab { background: #e3f2e9; color: inherit; border-radius: 4px; padding: 0 2px; }
    .empty-passage {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }
    .l5-input, .l5-short {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }
    input.l5-input, .l5-short { height: 44px; }
    .grammar-card summary { cursor: pointer; font-weight: 600; font-size: 15px; }
    .mini-label { font-size: 12px; color: var(--muted); margin: 10px 0 6px; font-weight: 600; }
    .ex-box { background: #f8f9f8; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
    .ex-box .ok { color: #067647; }
    .ex-box .ng { color: #b42318; }
    .tip { font-size: 13px; color: #8a5a00; background: #fff8e6; border-radius: 10px; padding: 8px 12px; }
    .parse-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .parse-chunk { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .parse-text { padding: 8px 12px; font-size: 15px; font-weight: 500; background: #fff; }
    .parse-role { padding: 4px 12px; font-size: 11px; background: #eef2ee; color: var(--muted); }
    .q-title { font-weight: 600; margin-top: 0; line-height: 1.6; }
    .q-card.q-ok { border-color: #a6d9bd; }
    .q-card.q-ng { border-color: #f3b4ae; }
    .option.is-answer { border-color: #067647; background: #e8f5ee; }
    .option.is-wrong { border-color: #b42318; background: #fef3f2; }
    .result-badge { display: inline-flex; border-radius: 999px; padding: 2px 10px; font-size: 12px; margin-left: 6px; }
    .result-badge.ok { background: #e8f5ee; color: #067647; }
    .result-badge.ng { background: #fef3f2; color: #b42318; }
    .feedback { border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 14px; line-height: 1.6; }
    .feedback.ok { background: #f0f9f4; }
    .feedback.ng { background: #fef6f5; }
    .feedback p { margin: 4px 0; }
    .fb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .fb-grid > div { background: #fff; border-radius: 10px; padding: 8px 10px; }
    .fb-grid .mini-label { margin-top: 0; }
    .score-card { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .missing-card { border-color: #f3b4ae; background: #fef6f5; margin-bottom: 8px; font-size: 14px; }
    .missing-card ul { margin: 8px 0 0; padding-left: 18px; }
    .missing-card a { color: #b42318; }

    @media (max-width: 720px) {
      .stats, .grid-2 { grid-template-columns: 1fr 1fr; }
      .day { flex-direction: column; align-items: flex-start; }
      .word-row { grid-template-columns: 1fr; gap: 4px; }
      .fb-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <header>
      <div>
        <p class="brand">English Lab</p>
        <p class="tagline">Your English journey, one day at a time.</p>
      </div>
      <div style="text-align:right;font-size:14px">
        <strong>기은</strong><div class="muted">학생</div>
      </div>
    </header>
    <nav class="tabs" aria-label="미리보기 탭">
      <button class="tab active" data-panel="dash" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        대시보드
      </button>
      <button class="tab" data-panel="learn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        레슨 (Lessons)
      </button>
      <button class="tab" data-panel="words" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h5"/></svg>
        단어 (Words)
      </button>
      <button class="tab" data-panel="hw" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        숙제 (Homeworks)
      </button>
    </nav>
  </div>

  <main>
    <!-- DASHBOARD -->
    <section id="dash" class="panel active">
      <div id="dash-root"></div>
    </section>

    <!-- LESSONS -->
    <section id="learn" class="panel">
      <div class="lesson-picker" id="lesson-picker"></div>
      <p class="muted" id="lesson-kicker"></p>
      <h1 class="brand" id="lesson-title" style="font-size:32px;margin:4px 0 4px"></h1>
      <p class="muted" id="lesson-subtitle" style="margin:0 0 4px"></p>

      <div class="mode-toggle sub-tabs" role="tablist">
        <button type="button" class="active" data-l5-sub="passage" onclick="L5.showSub('passage')">본문</button>
        <button type="button" data-l5-sub="check" onclick="L5.showSub('check')">이해 체크</button>
        <button type="button" data-l5-sub="comp" onclick="L5.showSub('comp')">본문 이해 문제</button>
        <button type="button" data-l5-sub="quiz" onclick="L5.showSub('quiz')">단어 시험</button>
      </div>

      <div id="l5-passage" class="l5-sub active"></div>
      <div id="l5-check" class="l5-sub"></div>
      <div id="l5-comp" class="l5-sub"></div>
      <div id="l5-quiz" class="l5-sub"></div>
    </section>

    <!-- WORDS -->
    <section id="words" class="panel">
      <p class="muted">Lesson 5–8 본문 단어 먼저 · 그다음 중1 기본 단어</p>
      <h1 class="brand" style="font-size:32px;margin:4px 0 4px">단어 (Words)</h1>
      <p class="muted">플래시카드로 넘기며 외우거나, 리스트로 쭉 읽어 보세요.</p>

      <div class="word-filters" id="word-filters"></div>

      <div class="mode-toggle" role="tablist">
        <button type="button" class="active" id="mode-flash" onclick="setWordMode('flash')">플래시카드</button>
        <button type="button" id="mode-list" onclick="setWordMode('list')">리스트</button>
      </div>

      <div style="margin-bottom:16px">
        <input
          id="word-search"
          type="search"
          placeholder="영어 단어 또는 한국어 뜻 검색…"
          style="width:100%;max-width:420px;height:44px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font:inherit;background:#fff"
          oninput="onWordSearch(this.value)"
        />
        <p class="help" id="word-filter-hint"></p>
      </div>

      <div class="flash-wrap" id="flash-wrap">
        <div class="flash-progress"><span id="flash-tag" class="word-tag"></span> <span id="flash-index">1</span> / <span id="flash-total">0</span></div>
        <div class="flash-card" id="flash-card" onclick="flipCard()">
          <div class="flash-inner">
            <div class="flash-face front">
              <div class="flash-word" id="fc-word">school</div>
              <div class="flash-pos" id="fc-pos">n.</div>
              <div class="flash-hint">클릭해서 뜻 보기</div>
            </div>
            <div class="flash-face back">
              <div class="flash-meaning" id="fc-meaning">학교</div>
              <div class="flash-example" id="fc-example">I walk to school every day.<br/>나는 매일 학교까지 걸어간다.</div>
              <div class="flash-hint">다시 클릭해서 앞면</div>
            </div>
          </div>
        </div>
        <div class="flash-nav">
          <button class="btn outline" type="button" id="btn-prev" onclick="prevCard()">← 이전</button>
          <button class="btn outline" type="button" onclick="flipCard()">뒤집기</button>
          <button class="btn" type="button" id="btn-next" onclick="nextCard()">다음 →</button>
        </div>
      </div>

      <div class="word-list card" id="word-list"></div>
    </section>

    <!-- HOMEWORKS -->
    <section id="hw" class="panel">
      <div id="hw-root"></div>
    </section>
  </main>

  <div id="drawer-backdrop" class="drawer-backdrop" onclick="L5.closeDrawer()"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="문장·단어 설명">
    <button type="button" class="drawer-close" aria-label="닫기" onclick="L5.closeDrawer()">✕</button>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <script src="preview-words.js?v=20261026b"></script>
  <script src="preview-lesson5.js?v=20261026b"></script>
  <script src="preview-lesson6.js?v=20261026b"></script>
  <script src="preview-lesson7.js?v=20261026b"></script>
  <script src="preview-lesson8.js?v=20261026b"></script>
  <script src="preview-understanding.js?v=20261026b"></script>
  <script src="preview-passage-words.js?v=20261026b"></script>
  <script src="preview-lessons-app.js?v=20261026b"></script>
  <script src="preview-homework.js?v=20261026b"></script>
  <script>
    const WORD_GROUPS = [
      { id: 'l5', label: 'Lesson 5' },
      { id: 'l6', label: 'Lesson 6' },
      { id: 'l7', label: 'Lesson 7' },
      { id: 'l8', label: 'Lesson 8' },
      { id: 'basic', label: '중1 기본 단어' },
    ];

    function buildWordDeck() {
      const seen = new Set();
      const deck = [];
      const add = (w, group) => {
        const key = w.word.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        (w.forms || []).forEach(f => seen.add(f.toLowerCase()));
        deck.push({ ...w, group });
      };
      const lessons = window.LESSON_DATA || {};
      const extra = window.PASSAGE_EXTRA_WORDS || {};
      ['l5', 'l6', 'l7', 'l8'].forEach(id => {
        (lessons[id] ? lessons[id].vocab : []).forEach(w => add(w, id));
        (extra[id] || []).forEach(w => add(w, id));
      });
      (window.ENGLISH_LAB_WORDS || []).forEach(w => add(w, 'basic'));
      return deck;
    }

    const ALL_WORDS = buildWordDeck();
    const groupLabel = id => (WORD_GROUPS.find(g => g.id === id) || {}).label || '';
    let wordGroup = 'lessons';
    let wordQuery = '';
    let filteredWords = [];
    let cardIndex = 0;

    function showPanel(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === id));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => showPanel(t.dataset.panel));
    });

    function selectOpt(el) {
      el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }

    function inGroup(w, group) {
      if (group === 'all') return true;
      if (group === 'lessons') return w.group !== 'basic';
      return w.group === group;
    }

    function renderWordFilters() {
      const count = g => ALL_WORDS.filter(w => inGroup(w, g)).length;
      const chips = [{ id: 'lessons', label: '본문 단어 전체' }, ...WORD_GROUPS, { id: 'all', label: '모두' }];
      document.getElementById('word-filters').innerHTML = chips
        .map(c => `<button type="button" class="word-filter ${wordGroup === c.id ? 'active' : ''}" onclick="setWordGroup('${c.id}')">${c.label} <span>${count(c.id)}</span></button>`)
        .join('');
    }

    function applyWordFilter() {
      const query = wordQuery.trim().toLowerCase();
      filteredWords = ALL_WORDS.filter(w => inGroup(w, wordGroup)).filter(w =>
        !query ||
        w.word.toLowerCase().includes(query) ||
        w.ko.toLowerCase().includes(query) ||
        w.ex.toLowerCase().includes(query)
      );
      cardIndex = 0;
      const total = ALL_WORDS.filter(w => inGroup(w, wordGroup)).length;
      document.getElementById('word-filter-hint').textContent =
        query ? `검색 결과 ${filteredWords.length}개 / ${total}개` : `${total}개`;
      renderWordFilters();
      renderCard();
      renderList();
    }

    function setWordGroup(group) {
      wordGroup = group;
      applyWordFilter();
    }

    function onWordSearch(q) {
      wordQuery = q || '';
      applyWordFilter();
    }

    function renderCard() {
      const w = filteredWords[cardIndex];
      if (!w) {
        document.getElementById('fc-word').textContent = '없음';
        document.getElementById('fc-pos').textContent = '';
        document.getElementById('fc-meaning').textContent = '검색 결과가 없어요';
        document.getElementById('fc-example').textContent = '';
        document.getElementById('flash-index').textContent = '0';
        document.getElementById('flash-total').textContent = '0';
        document.getElementById('btn-prev').disabled = true;
        document.getElementById('btn-next').disabled = true;
        return;
      }
      document.getElementById('flash-tag').textContent = groupLabel(w.group);
      document.getElementById('fc-word').textContent = w.word;
      document.getElementById('fc-pos').textContent = w.pos;
      document.getElementById('fc-meaning').textContent = w.ko;
      document.getElementById('fc-example').innerHTML = w.ex + '<br/>' + w.exKo;
      document.getElementById('flash-index').textContent = String(cardIndex + 1);
      document.getElementById('flash-total').textContent = String(filteredWords.length);
      document.getElementById('flash-card').classList.remove('flipped');
      document.getElementById('btn-prev').disabled = cardIndex === 0;
      document.getElementById('btn-next').disabled = cardIndex >= filteredWords.length - 1;
    }

    function flipCard() {
      if (!filteredWords.length) return;
      document.getElementById('flash-card').classList.toggle('flipped');
    }

    function nextCard() {
      if (cardIndex < filteredWords.length - 1) {
        cardIndex += 1;
        renderCard();
      }
    }

    function prevCard() {
      if (cardIndex > 0) {
        cardIndex -= 1;
        renderCard();
      }
    }

    function setWordMode(mode) {
      document.getElementById('mode-flash').classList.toggle('active', mode === 'flash');
      document.getElementById('mode-list').classList.toggle('active', mode === 'list');
      document.getElementById('flash-wrap').classList.toggle('hidden', mode !== 'flash');
      document.getElementById('word-list').classList.toggle('active', mode === 'list');
    }

    function renderList() {
      const list = document.getElementById('word-list');
      if (!filteredWords.length) {
        list.innerHTML = '<p class="muted" style="margin:0">검색 결과가 없어요.</p>';
        return;
      }
      list.innerHTML = filteredWords.map((w, i) => `
        <div class="word-row">
          <div>
            <div class="word-en">${i + 1}. ${w.word}</div>
            <span class="word-tag">${groupLabel(w.group)}</span>
          </div>
          <div class="word-pos">${w.pos}</div>
          <div>
            <div class="word-ko">${w.ko}</div>
            <div class="word-ex">${w.ex}<br/>${w.exKo}</div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('keydown', (e) => {
      const wordsOpen = document.getElementById('words').classList.contains('active');
      if (!wordsOpen) return;
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === ' ' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        flipCard();
      }
    });

    applyWordFilter();
  </script>
</body>
</html>
